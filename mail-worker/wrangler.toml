name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
  binding = "db"
  database_name = "cloud-mail"
  database_id = "f0d19e8b-c7ce-450f-8608-ffc2ce66c304"

  [[kv_namespaces]]
  binding = "kv"
  id = "11ae4287ee474faaa1b3767a34013b77"

#[[r2_buckets]]
#binding = "r2"			#r2对象存储绑定名默认不可修改
#bucket_name = ""		#r2对象存储桶的名字

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["*/30 * * * *", "0 16 * * *"]	#每30分钟刷新分析缓存，每天晚上12点执行每日任务


[vars]
#ai_model = ""
  #analysis_cache = false
  #orm_log = false
  domain = ["mothlogic.com"]
  admin = "admin@mothlogic.com"
  jwt_secret = "mothlogic2026key888"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
